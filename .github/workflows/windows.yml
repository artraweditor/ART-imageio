name: Windows Builds

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    permissions:
      contents: write

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: minimal
          install: >-
            base-devel
            git
            wget
            unzip
            zip
            tar
            zstd
            perl
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-yasm
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libyuv
            mingw-w64-ucrt-x86_64-lcms2
            mingw-w64-ucrt-x86_64-libtiff
            mingw-w64-ucrt-x86_64-brotli
            mingw-w64-ucrt-x86_64-expat
            mingw-w64-ucrt-x86_64-libinih
            mingw-w64-ucrt-x86_64-exiv2
            mingw-w64-ucrt-x86_64-librsvg

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Get version
        shell: bash
        run: |
          cd repo
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "ART_IMGIO_VERSION=$GITHUB_REF_NAME" >> $GITHUB_ENV
          else
              echo "ART_IMGIO_VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          fi
          echo "ART_IMGIO_NAME=ART-imageio-bin-win64" >> $GITHUB_ENV

      - name: Install standalone Python
        shell: bash
        run: |
          PY_VERSION=3.12.11
          PY_RELEASE=20250612
          tarball=cpython-${PY_VERSION}+${PY_RELEASE}-x86_64-pc-windows-msvc-install_only.tar.gz
          curl -LO https://github.com/astral-sh/python-build-standalone/releases/download/${PY_RELEASE}/${tarball}
          tar xzf ${tarball}

      - name: Create Python virtualenv
        shell: bash
        run: |
          python/python.exe -m venv venv

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install custom NumPy
        shell: bash
        run: |
          . venv/Scripts/activate
          python -m pip install --upgrade pip
          python -m pip install meson meson-python ninja
          git clone --branch v2.2.2 --depth 1 https://github.com/numpy/numpy.git
          cd numpy
          git submodule update --init
          python -m pip install -r requirements/all_requirements.txt
          python -m pip install . \
            -Csetup-args=--vsenv \
            -Csetup-args=-Dblas=disabled \
            -Csetup-args=-Dlapack=disabled

      - name: Install required Python packages
        shell: bash
        run: |
          . venv/Scripts/activate
          python -m pip install -r repo/helpers/python/requirements.txt
          python -m pip install PyInstaller

      - name: Build Python installer
        shell: bash
        run: |
          . venv/Scripts/activate
          python repo/helpers/pyinstaller/run_pyinstaller.py -o out
          mkdir ${ART_IMGIO_NAME}
          mv out/python3/python3.exe ${ART_IMGIO_NAME}
          mv out/python3/_internal ${ART_IMGIO_NAME}

      - name: Build ultrahdr binaries
        run: |
          ULTRAHDR_VERSION='1.4.0'
          mkdir ultrahdr
          cd ultrahdr
          wget https://github.com/google/libultrahdr/archive/refs/tags/v${ULTRAHDR_VERSION}.tar.gz
          tar xzf v${ULTRAHDR_VERSION}.tar.gz
          mkdir build
          cd build
          cmake \
            -G Ninja \
            -DCMAKE_FIND_LIBRARY_SUFFIXES=.a \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=0 \
            -DUHDR_WRITE_XMP=1 \
            -DCMAKE_EXE_LINKER_FLAGS=-static \
            ../libultrahdr-${ULTRAHDR_VERSION}
          ninja
          cp -a ultrahdr_app.exe ../../${ART_IMGIO_NAME}

      - name: Build jxl binaries
        run: |
          JXL_VERSION='0.12.0'
          libdir=$(cygpath -m ${MINGW_PREFIX}/lib)
          mkdir jxl
          cd jxl
          wget https://github.com/libjxl/libjxl/archive/refs/tags/v${JXL_VERSION}.tar.gz
          tar xzf v${JXL_VERSION}.tar.gz
          cd libjxl-${JXL_VERSION}
          ./deps.sh
          cd ..
          mkdir build
          cd build
          cmake \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_LIBRARY_SUFFIXES=.a \
            -DBUILD_SHARED_LIBS=0 \
            -DJPEGXL_ENABLE_OPENEXR=0 \
            -DJPEGXL_ENABLE_JNI=0 \
            -DBUILD_TESTING=0 \
            -DJPEGXL_ENABLE_BENCHMARK=0 \
            -DJPEGXL_ENABLE_EXAMPLES=0 \
            -DJPEGXL_ENABLE_JPEGLI=0 \
            -DJPEGXL_ENABLE_SJPEG=0 \
            -DJPEGXL_BUNDLE_LIBPNG=1 \
            -DJPEGXL_ENABLE_JPEGLI_LIBJPEG=0 \
            -DCMAKE_EXE_LINKER_FLAGS=-static \
            -DJPEG_LIBRARY_RELEASE=${libdir}/libjpeg.a \
            -DZLIB_LIBRARY_RELEASE=${libdir}/libz.a \
            ../libjxl-${JXL_VERSION}
          ninja
          cp -a tools/cjxl.exe tools/djxl.exe tools/jxlinfo.exe ../../${ART_IMGIO_NAME}

      - name: Build avif binaries
        run: |
          AVIF_VERSION='1.4.2'
          libdir=$(cygpath -m ${MINGW_PREFIX}/lib)
          mkdir avif
          cd avif
          wget https://github.com/AOMediaCodec/libavif/archive/refs/tags/v${AVIF_VERSION}.tar.gz
          tar xzf v${AVIF_VERSION}.tar.gz
          mkdir build
          cd build
          cmake \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=0 \
            -DCMAKE_FIND_LIBRARY_SUFFIXES=.a \
            -DAVIF_CODEC_AOM=LOCAL \
            -DAVIF_BUILD_APPS=1 \
            -DAVIF_ENABLE_GTEST=0 \
            -DAVIF_ZLIBPNG=SYSTEM \
            -DAVIF_JPEG=SYSTEM \
            -DAVIF_LIBYUV=SYSTEM \
            -DAVIF_CODEC_AOM_DECODE=1 \
            -DAVIF_CODEC_AOM_ENCODE=1 \
            -DCMAKE_EXE_LINKER_FLAGS=-static \
            -DLIBYUV_LIBRARY=${libdir}/libyuv.a \
            -DJPEG_LIBRARY_RELEASE=${libdir}/libjpeg.a \
            -DPNG_LIBRARY_RELEASE=${libdir}/libpng.a \
            -DZLIB_LIBRARY_RELEASE=${libdir}/libz.a \
            ../libavif-${AVIF_VERSION}
          ninja
          cp -a avifenc.exe ../../${ART_IMGIO_NAME}

      - name: Build gpr_tools binary
        run: |
          mkdir gpr
          cd gpr
          git clone --depth 1 https://github.com/gopro/gpr.git
          mkdir build
          cd build
          cmake \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS=-static \
            -DCMAKE_CXX_FLAGS=-D__LITTLE_ENDIAN__ \
            ../gpr
          ninja
          cp -a source/app/gpr_tools/gpr_tools.exe ../../${ART_IMGIO_NAME}

      - name: Get dnglab binary
        run: |
          DNGLAB_VERSION=0.7.2
          wget https://github.com/dnglab/dnglab/releases/download/v${DNGLAB_VERSION}/dnglab-win-x64_v${DNGLAB_VERSION}.zip
          unzip -o dnglab-win-x64_v${DNGLAB_VERSION}.zip -d dnglab_dl
          cp "$(find dnglab_dl -name dnglab.exe | head -1)" ${ART_IMGIO_NAME}

      - name: Bundle any remaining runtime DLLs
        run: |
          cd ${ART_IMGIO_NAME}
          for exe in ultrahdr_app.exe cjxl.exe djxl.exe jxlinfo.exe avifenc.exe gpr_tools.exe; do
              echo "== $exe"
              if ldd $exe | grep -q "${MINGW_PREFIX}/bin"; then
                  ldd $exe | grep "${MINGW_PREFIX}/bin"
                  ldd $exe | grep "${MINGW_PREFIX}/bin" | cut -d' ' -f3 | sort -u | while read -r dll; do cp -n "$dll" . ; done
              else
                  echo "  (no mingw DLLs)"
              fi
          done

      - name: Create bundle
        run: |
          ARTIFACT_NAME=${ART_IMGIO_NAME}.tar.gz
          tar czf ${ARTIFACT_NAME} ${ART_IMGIO_NAME}
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "RELEASE_TAG=${ART_IMGIO_VERSION}" >> $GITHUB_ENV
              echo "RELEASE_MAKE_LATEST=true" >> $GITHUB_ENV
          else
              echo "RELEASE_TAG=nightly" >> $GITHUB_ENV
              echo "RELEASE_MAKE_LATEST=false" >> $GITHUB_ENV
          fi

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          body: ${{ env.RELEASE_TAG }}
          allowUpdates: true
          makeLatest: ${{ env.RELEASE_MAKE_LATEST }}
          artifacts: ${{ env.ARTIFACT_NAME }}
